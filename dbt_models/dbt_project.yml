# dbt_project.yml
#
# AUTHORED, NOT RUN VIA A REAL `dbt` CLI / Snowflake connection. There is no dbt
# installation or Snowflake account in this environment. These are real,
# syntactically correct dbt model files (ref()/source() macros, config blocks,
# schema.yml conventions) that would run against Snowflake with `dbt run` if
# deployed. The equivalent SQL logic is ALSO actually executed against a local
# DuckDB warehouse in local_pipeline/run_dbt_equivalent.py, which proves the
# transformation logic is correct even though real dbt/Snowflake were not used.

name: 'cmc_semantic_layer'
version: '1.0.0'
config-version: 2

profile: 'cmc_semantic_layer'

model-paths: ["staging", "marts"]
seed-paths: ["seeds"]
test-paths: ["tests"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  cmc_semantic_layer:
    staging:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: marts
      +tags: ['cmc_marts']
